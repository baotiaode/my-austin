# 用 8081 端口，避免和 austin 的 8080 冲突
server.port=8081
spring.application.name=my-austin

# MySQL 连接（库名 my_austin）
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/my_austin?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
# 密码外置为环境变量 DB_PASSWORD，本地运行时配置，别写进仓库
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus：在控制台打印 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}

# Kafka 连接地址
spring.kafka.bootstrap-servers=${KAFKA_HOST:127.0.0.1}:${KAFKA_PORT:9092}

# 生产者：key/value 序列化方式（都转成字符串）
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# 消费者：key/value 反序列化方式 + 从头消费
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ===== 自定义业务配置：topic 和消费组 =====
my-austin.kafka.topic=austin-send-topic
my-austin.kafka.consumer-group=my-austin-group

my-austin.kafka.dead-letter-topic=austin-dead-letter-topic
my-austin.kafka.dead-letter-group=my-austin-dead-letter-group

my-austin.limit.window-seconds=60
my-austin.limit.max-count=3

# ===== 夜间屏蔽时段（小时）。跨天用 start > end，如 22~次日8点 =====
my-austin.shield.start-hour=22
my-austin.shield.end-hour=8

# ===== 撤回窗口（秒）=====
my-austin.recall.window-seconds=60

# ===== 暴露 actuator 端点（监控）=====
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
